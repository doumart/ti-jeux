<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Les p’tits jeux</title>
  <link rel="stylesheet" href="/.proxy/style.css?v=__VERSION__">
</head>
<body>
  <div class="stage" id="stage" tabindex="0"><video id="video" autoplay playsinline muted aria-label="The shared games"></video></div>
  <section id="splash">
    <h1>Les p’tits jeux!</h1>
    <p id="status" role="status" aria-live="polite">Connecting to Discord…</p>
    <p class="dim"><span id="game"></span> <span id="progress"></span></p>
    <div id="preview" hidden>
      <button id="create">Create preview session</button>
      <label id="invite-label" hidden>Viewer link<input id="invite" readonly></label>
    </div>
    <button id="start" class="big" disabled>Start</button>
    <button id="reconnect" hidden>Reconnect</button>
  </section>
  <div class="music">
    <button id="music-toggle" aria-pressed="true">♪ Music on</button>
    <input id="music-volume" type="range" min="0" max="1" step="0.05" aria-label="Music volume">
  </div>
  <audio id="theme" preload="auto"></audio>
  <script type="module" src="/.proxy/client.js?v=__VERSION__"></script>
</body>
</html>
